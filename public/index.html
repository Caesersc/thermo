<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Goon Olympics</title>

<meta property="og:title" content="Tip on Ko-fi ☕ — Goon Olympics">
<meta property="og:description" content="Live-updating tip tracker">
<meta property="og:image" content="/thermometer.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/thermometer.png">

<style>
  :root {
    --bg-top: #0a0a0d;
    --bg-bottom: #131318;
    --grid: rgba(212, 175, 55, 0.055);
    --gold: #d4af37;
    --gold-bright: #f2d572;
    --gold-dim: rgba(212, 175, 55, 0.35);
    --gold-glow: rgba(242, 213, 114, 0.5);
    --text: #eae6da;
    --text-dim: #8a8578;
    --steam: #f7f1e3;
    --steam-dim: rgba(247, 241, 227, 0.4);
    --glass-stroke: rgba(234, 230, 218, 0.28);
    --silver: #c9d0d6;
    --bronze: #c9884a;
    --live: #6fbf8f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
  }

  body {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
  }

  .stage {
    width: 100%;
    max-width: 720px;
    position: relative;
    padding: 48px 44px 40px;
    animation: stageIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes stageIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stage::before, .stage::after,
  .stage .br-tr, .stage .br-bl {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: var(--gold-dim);
    border-style: solid;
    border-width: 0;
  }
  .stage::before { top: 0; left: 0; border-top-width: 1.5px; border-left-width: 1.5px; }
  .stage .br-tr   { top: 0; right: 0; border-top-width: 1.5px; border-right-width: 1.5px; }
  .stage .br-bl   { bottom: 0; left: 0; border-bottom-width: 1.5px; border-left-width: 1.5px; }
  .stage::after  { bottom: 0; right: 0; border-bottom-width: 1.5px; border-right-width: 1.5px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', 'SF Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin: 0 0 8px;
    text-align: center;
  }

  .headline {
    text-align: center;
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 28px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: -16px 0 26px;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 6px rgba(111,191,143,0.7);
    animation: liveDotPulse 1.6s ease-in-out infinite;
  }
  @keyframes liveDotPulse {
    0%, 100% { opacity: 0.5; transform: scale(0.85); }
    50%      { opacity: 1; transform: scale(1.15); }
  }

  /* ---------- Mug ---------- */

  .mug-wrap {
    position: relative;
    width: 240px;
    height: 300px;
    margin: 0 auto 8px;
  }

  .mug-glow {
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-glow) 0%, transparent 65%);
    opacity: 0.35;
    filter: blur(10px);
    animation: pulseGlow 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.25; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(1.05); }
  }

  svg.mug-svg { position: relative; width: 100%; height: 100%; display: block; transform-origin: 50% 85%; }

  @keyframes clinkWiggle {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(-3deg); }
    60%      { transform: rotate(2.5deg); }
    85%      { transform: rotate(-1deg); }
  }
  svg.mug-svg.clink { animation: clinkWiggle 0.45s ease; }

  .steam {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to top, var(--steam-dim), transparent);
    filter: blur(2.5px);
    pointer-events: none;
    will-change: transform, opacity;
  }
  @keyframes steamRise {
    0%   { transform: translateY(0) translateX(0) scale(0.7) rotate(0deg); opacity: 0; }
    18%  { opacity: 0.6; }
    55%  { transform: translateY(-46px) translateX(6px) scale(1.15) rotate(6deg); opacity: 0.4; }
    100% { transform: translateY(-92px) translateX(-5px) scale(1.4) rotate(-5deg); opacity: 0; }
  }

  .puff {
    position: absolute;
    border-radius: 50%;
    background: var(--steam);
    pointer-events: none;
  }
  @keyframes puffBurst {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: var(--burst-end) scale(0.5); opacity: 0; }
  }

  .support-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 26px auto 0;
    flex-wrap: wrap;
  }

  .tip-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 32px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-align: center;
    text-decoration: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.2s ease;
  }
  .tip-btn.primary {
    color: var(--bg-top);
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    border: none;
    box-shadow: 0 0 0 rgba(242,213,114,0);
  }
  .tip-btn.primary:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 30px rgba(242,213,114,0.35);
  }
  .tip-btn.secondary {
    color: var(--gold-bright);
    background: transparent;
    border: 1.5px solid var(--gold-dim);
  }
  .tip-btn.secondary:hover {
    transform: translateY(-2px) scale(1.03);
    border-color: var(--gold);
    background: rgba(212, 175, 55, 0.08);
  }
  .tip-btn:active { transform: translateY(0) scale(0.98); }
  .tip-btn:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
  }

  .community-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .community-link:hover,
  .community-link:focus-visible { color: var(--gold-bright); }

  /* ---------- Affiliates ---------- */

  .affiliates { margin-top: 32px; }
  .affiliate-row {
    display: flex;
    gap: 22px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .affiliate-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 76px;
    text-decoration: none;
    border-radius: 12px;
    opacity: 0;
    animation: bubbleIn 0.5s ease forwards;
  }
  .affiliate-item:nth-child(1) { animation-delay: 0.05s; }
  .affiliate-item:nth-child(2) { animation-delay: 0.12s; }
  .affiliate-item:nth-child(3) { animation-delay: 0.19s; }
  .affiliate-item:nth-child(4) { animation-delay: 0.26s; }
  .affiliate-item:nth-child(5) { animation-delay: 0.33s; }
  .affiliate-item:nth-child(6) { animation-delay: 0.40s; }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(6px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .affiliate-icon {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
    border: 2px solid var(--gold-dim);
    color: var(--gold-bright);
    transition: transform 0.25s cubic-bezier(0.22,1,0.36,1), box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .affiliate-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .affiliate-caption {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.01em;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.3;
    transition: color 0.25s ease;
  }
  .affiliate-item:hover .affiliate-icon,
  .affiliate-item:focus-visible .affiliate-icon {
    transform: translateY(-5px) scale(1.08);
    border-color: var(--gold);
    box-shadow: 0 10px 26px rgba(242,213,114,0.3);
  }
  .affiliate-item:hover .affiliate-caption,
  .affiliate-item:focus-visible .affiliate-caption { color: var(--gold-bright); }
  .affiliate-item:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 4px; }
  .affiliate-icon.tier-gold   { border-color: var(--gold-bright); box-shadow: 0 0 14px rgba(242,213,114,0.22); }
  .affiliate-icon.tier-silver { border-color: var(--silver); }
  .affiliate-icon.tier-bronze { border-color: var(--bronze); }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translate(-50%, -140%);
    background: rgba(15,15,18,0.92);
    border: 1.5px solid var(--gold-dim);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-family: 'IBM Plex Mono', monospace;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 50;
    white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .stage { padding: 36px 20px 28px; }
    .mug-wrap { width: 190px; height: 240px; }
    .support-row { flex-direction: column; align-items: stretch; }
    .tip-btn { width: 100%; }
    .affiliate-item { width: 64px; }
    .affiliate-icon { width: 50px; height: 50px; font-size: 19px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage, .mug-glow, .steam, .puff, .tip-btn, .live-dot,
    .affiliate-item, .mug-svg.clink { animation: none !important; transition: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <span class="br-tr"></span><span class="br-bl"></span>

  <p class="eyebrow">OFFICIAL TIP TRACKER</p>
  <p class="headline">every drop below is a real tip, live</p>
  <p class="live-badge"><span class="live-dot"></span><span id="onlineCount">–</span>&nbsp;here right now</p>

  <div class="mug-wrap" id="mugWrap">
    <div class="mug-glow"></div>
    <svg class="mug-svg" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="mugClip">
          <path d="M58,60 L182,60 L182,256 Q182,274 164,274 L76,274 Q58,274 58,256 Z" />
        </clipPath>
        <linearGradient id="coffeeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7a4a26" />
          <stop offset="100%" stop-color="#2e1a0d" />
        </linearGradient>
        <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.10)" />
          <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
        </linearGradient>
      </defs>

      <!-- handle, drawn behind the glass body -->
      <path d="M182,106 Q224,106 224,150 Q224,194 182,194" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="20" stroke-linecap="round" />
      <path d="M182,106 Q224,106 224,150 Q224,194 182,194" fill="none" stroke="var(--glass-stroke)" stroke-width="3" stroke-linecap="round" />

      <g clip-path="url(#mugClip)">
        <rect id="liquidRect" x="58" y="274" width="124" height="0" fill="url(#coffeeGrad)" />
        <path id="liquidWave" d="M58,274 Q83,266 120,274 T182,274 V300 H58 Z" fill="url(#coffeeGrad)" opacity="0.92" />
      </g>

      <path d="M58,60 L182,60 L182,256 Q182,274 164,274 L76,274 Q58,274 58,256 Z"
            fill="url(#glassGrad)" stroke="var(--glass-stroke)" stroke-width="2" />

      <rect x="52" y="50" width="136" height="14" rx="4" fill="none" stroke="var(--gold-dim)" stroke-width="2" />
    </svg>
  </div>

  <div class="support-row">
    <a class="tip-btn primary" href="https://ko-fi.com/goonolympics" target="_blank" rel="noopener noreferrer" data-track="kofi">Tip on Ko-fi ☕</a>
    <a class="tip-btn secondary" href="https://www.patreon.com/goonolympics" target="_blank" rel="noopener noreferrer" data-track="patreon">Join on Patreon 🎗</a>
  </div>
  <a class="community-link" href="https://discord.gg/Xckf7pXPK" target="_blank" rel="noopener noreferrer" data-track="discord">💬 Join the Discord</a>

  <div class="affiliates">
    <div class="section-label"><span>OFFICIAL SPONSORS</span></div>
    <!-- AFFILIATE-ROW-START: generate this block with affiliate-builder.html and paste it in here -->
    <div class="affiliate-row">
      <a class="affiliate-item" href="https://t.mbmbchw.link/409352/6224/0?po=6533&aff_sub5=SF_006OG000004lmDN" target="_blank" rel="noopener noreferrer" aria-label="Need A Partner? — opens in a new tab" data-track="Need A Partner?">
        <span class="affiliate-icon tier-gold">🔗</span>
        <span class="affiliate-caption">Need A Hand?</span>
      </a>
      <a class="affiliate-item" href="https://t.camsk5.com/409352/3688/0?po=6533&aff_sub5=SF_006OG000004lmDN" target="_blank" rel="noopener noreferrer" aria-label="Wanna Chat? — opens in a new tab" data-track="Wanna Chat?">
        <span class="affiliate-icon tier-silver">🔗</span>
        <span class="affiliate-caption">You Look Lonely</span>
      </a>
      <a class="affiliate-item" href="https://www.lovense.com/r/yw6pqm" target="_blank" rel="noopener noreferrer" aria-label="Toys N Stuff — opens in a new tab" data-track="Toys N Stuff">
        <span class="affiliate-icon tier-bronze">🔗</span>
        <span class="affiliate-caption">Toys N Stuff</span>
      </a>
      <a class="affiliate-item" href="https://track.aftrk3.com/38df6f12-f103-452f-9386-22bba88ec8ef?ats=eyJhIjoxNzM4NzkzLCJjIjo2NDUwMDIyNywibiI6MzcsInMiOjczNSwiZSI6MTEwNTIsInAiOjMxN30=&aff_token=Ly0qNiA7IDgu" target="_blank" rel="noopener noreferrer" aria-label="For Your Wildest Fantasies — opens in a new tab" data-track="For Your Wildest Fantasies">
        <span class="affiliate-icon">🔗</span>
        <span class="affiliate-caption">For Your Wildest Fantasies</span>
      </a>
    </div>
    <!-- AFFILIATE-ROW-END -->
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let currentTotal = 0;
  let firstLoad = true;
  const MUG_TOP = 62, MUG_BOTTOM = 274;

  function setLiquidLevel(pct) {
    const y = MUG_BOTTOM - (MUG_BOTTOM - MUG_TOP) * Math.max(0, Math.min(1, pct));
    const h = MUG_BOTTOM - y;
    document.getElementById('liquidRect').setAttribute('y', y);
    document.getElementById('liquidRect').setAttribute('height', h);
    document.getElementById('liquidWave').setAttribute(
      'd', `M58,${y} Q83,${y - 8} 120,${y} T182,${y} V300 H58 Z`
    );
  }

  function spawnSteam() {
    const wrap = document.getElementById('mugWrap');
    const wisp = document.createElement('div');
    wisp.className = 'steam';
    const w = 8 + Math.random() * 5;
    const h = 26 + Math.random() * 14;
    wisp.style.width = w + 'px';
    wisp.style.height = h + 'px';
    wisp.style.left = (44 + Math.random() * 14) + '%';
    wisp.style.bottom = '80%';
    wisp.style.animation = `steamRise ${3 + Math.random() * 1.6}s ease-out forwards`;
    wrap.appendChild(wisp);
    setTimeout(() => wisp.remove(), 5000);
  }
  setInterval(spawnSteam, 1500);
  spawnSteam();

  function burstSteam(count) {
    const wrap = document.getElementById('mugWrap');
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'puff';
      const size = 3 + Math.random() * 5;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = (44 + Math.random() * 12) + '%';
      p.style.top = '20%';
      const angle = (Math.random() * Math.PI) - Math.PI / 2 - Math.PI / 4;
      const dist = 60 + Math.random() * 70;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40;
      p.style.setProperty('--burst-end', `translate(${dx}px, ${dy}px)`);
      p.style.animation = `puffBurst ${0.8 + Math.random() * 0.5}s cubic-bezier(0.22,1,0.36,1) forwards`;
      wrap.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
    const svg = document.querySelector('.mug-svg');
    svg.classList.add('clink');
    setTimeout(() => svg.classList.remove('clink'), 450);
  }

  function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  async function refresh() {
    let data;
    try {
      const res = await fetch('/api/stats', { cache: 'no-store' });
      data = await res.json();
    } catch (err) {
      return;
    }

    const isNewTip = !firstLoad && data.total > currentTotal;

    setLiquidLevel(data.pct);

    if (isNewTip) {
      burstSteam(14);
      const latest = data.recent && data.recent[0];
      if (latest) {
        showToast(`☕ ${latest.name || 'Anonymous'} just bought a coffee`);
      }
    }

    currentTotal = data.total;
    firstLoad = false;

    const onlineEl = document.getElementById('onlineCount');
    if (onlineEl) onlineEl.textContent = data.online ?? '–';
  }

  refresh();
  setInterval(refresh, 5000);

  // ---------- Live presence ----------
  const clientId = (() => {
    let id = sessionStorage.getItem('gc_client_id');
    if (!id) {
      id = Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem('gc_client_id', id);
    }
    return id;
  })();

  function heartbeat() {
    fetch('/api/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId }),
    }).catch(() => {});
  }
  heartbeat();
  setInterval(heartbeat, 10000);

  // ---------- Click tracking ----------
  function trackClick(linkId) {
    const payload = JSON.stringify({ linkId });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/track-click', new Blob([payload], { type: 'application/json' }));
    } else {
      fetch('/api/track-click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true,
      }).catch(() => {});
    }
  }
  document.querySelectorAll('[data-track]').forEach(el => {
    el.addEventListener('click', () => trackClick(el.dataset.track));
  });
</script>

</body>
</html>
